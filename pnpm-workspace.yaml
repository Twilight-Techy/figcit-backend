packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@nestjs/core'
  - argon2
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

overrides:
  # Security (pnpm audit): fixed versions of transitive dependencies.
  deepmerge-ts: ^8.0.0
  # @nestjs/platform-fastify 11 pins fastify 5.11.3; 5.12.2+ fixes four high advisories.
  fastify: 5.12.7
