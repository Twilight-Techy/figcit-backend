# Local stack: Postgres, Mailpit (email), SeaweedFS (S3-compatible storage).
# Start with: docker compose -f docker/compose.dev.yml up -d
# Each git worktree gets its own database in this one Postgres: `pnpm db:worktree`.
name: figcit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: figcit
      POSTGRES_PASSWORD: figcit
      POSTGRES_DB: figcit
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U figcit']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web inbox

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - '8333:8333' # S3 API
    volumes:
      - seaweedfs:/data

  # Creates the dev bucket (S3_BUCKET) once SeaweedFS is up.
  seaweedfs-bucket:
    image: chrislusf/seaweedfs:latest
    depends_on: [seaweedfs]
    restart: 'no'
    entrypoint:
      - sh
      - -c
      - sleep 5 && echo 's3.bucket.create -name figcit-private' | weed shell -master=seaweedfs:9333

volumes:
  postgres:
  seaweedfs:
